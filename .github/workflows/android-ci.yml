name: Android CI

on:
  push:
    branches: [ feature/test-only-change-modules ]
  pull_request:
    branches:
      - feature/test-only-change-modules

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults: &android-setup
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: gradle
    - uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.android/build-cache
          ~/.gradle/caches
        key: android-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          android-cache-${{ runner.os }}-
    - run: chmod +x gradlew
    - name: Configure Gradle
      run: |
        echo "org.gradle.parallel=true" >> gradle.properties
        echo "org.gradle.caching=true" >> gradle.properties
        echo "org.gradle.configureondemand=true" >> gradle.properties

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
      has-domain-changes: ${{ contains(steps.filter.outputs.changes, 'domain') || contains(steps.filter.outputs.changes, 'core') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate module filters
        id: set-filters
        run: |
          echo "filters:" > filters.yml
          # Find all Android modules (directories with build.gradle)
          find . -name build.gradle -not -path '*/build/*' | while read f; do
            dir=$(dirname $f | sed 's|^./||')
            module_name=${dir//\//-}
            echo "  $module_name:" >> filters.yml
            echo "    - '$dir/**'" >> filters.yml
          done
          cat filters.yml

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ./filters.yml
          base: ${{ github.event.pull_request.base.sha || github.sha }}


  test-changed-modules:
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && (needs.detect-changes.outputs.modules != '[]' || github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    <<: *android-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            **/build/classes
            **/build/kotlin
            **/build/tmp/kotlin-classes
          key: build-outputs-${{ runner.os }}-${{ github.sha }}-${{ matrix.module }}
          restore-keys: build-outputs-${{ runner.os }}-

      - name: Test changed module
        run: ./gradlew ${{ matrix.module.replace(/-/g, ':') }}:test --build-cache


      - name: Test dependent modules
        if: ${{ needs.detect-changes.outputs.has-domain-changes == 'true' && matrix.module == 'app' }}
        run: |
          ./gradlew :feature:authentication:test \
                   :feature:home:test \
                   :feature:profile:test


  full-verification:
    needs: [ detect-changes, test-changed-modules ]
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    <<: *android-setup
    steps:
      - name: Restore build outputs
        uses: actions/cache@v4
        with:
          path: |
            **/build/classes
            **/build/kotlin
            **/build/tmp/kotlin-classes
          key: build-outputs-${{ runner.os }}-${{ github.sha }}

      - name: Run all tests
        run: ./gradlew test --build-cache

      - name: Generate coverage reports
        run: |
          ./gradlew koverXmlReport --build-cache
          ./gradlew koverHtmlReport --build-cache

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify coverage
        run: ./gradlew koverVerify --build-cache


  build-release:
    needs: full-verification
    if: github.event_name == 'push'
    <<: *android-setup
    steps:
      - name: Setup signing
        run: |
          mkdir -p $GITHUB_WORKSPACE/appkey
          echo "$JKS_BASE64" | base64 --decode > $GITHUB_WORKSPACE/appkey/aflami-release-key.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/appkey/aflami-release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
        env:
          JKS_BASE64: ${{ secrets.JKS_BASE64 }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -x test --build-cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt


  pr-signed-build:
    needs: full-verification
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'qa-build') }}
    <<: *android-setup
    steps:
      - name: Setup signing
        run: |
          mkdir -p $GITHUB_WORKSPACE/appkey
          echo "$JKS_BASE64" | base64 --decode > $GITHUB_WORKSPACE/appkey/aflami-release-key.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/appkey/aflami-release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
        env:
          JKS_BASE64: ${{ secrets.JKS_BASE64 }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -x test --build-cache

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pr-signed-build
          path: app/build/outputs/apk/release/*.apk